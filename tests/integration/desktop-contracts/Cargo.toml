[package]
name = "notype-desktop-contracts"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "notype-deepseek-probe"
path = "../deepseek_probe_main.rs"

[[bin]]
name = "notype-probe-console-fixture"
path = "../deepseek_probe_console_fixture.rs"

[[test]]
name = "deepseek-probe-bridge"
path = "../deepseek_probe_bridge.rs"

[[test]]
name = "deepseek-probe-round"
path = "../deepseek_probe_round.rs"

[[test]]
name = "deepseek-probe-console"
path = "../../unittest/deepseek_probe_console.rs"

[[test]]
name = "deepseek-probe-native"
path = "../deepseek_probe_native.rs"

[[test]]
name = "history-metrics-dto"
path = "../history_metrics_dto.rs"

[dependencies]
notype-core = { path = "../../../crates/notype-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
ferrous-opencc = "0.2.3"
opencc-jieba-rs = { version = "=0.8.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[[test]]
name = "desktop-workflow"
path = "../../unittest/desktop_workflow.rs"

[[test]]
name = "desktop-provider"
path = "../desktop_provider.rs"

[[test]]
name = "physical-gestures"
path = "../../unittest/physical_gestures.rs"

[[test]]
name = "desktop-diagnostics"
path = "../../unittest/desktop_diagnostics.rs"

[[test]]
name = "diagnostics-export"
path = "../desktop_diagnostics.rs"

[[test]]
name = "diagnostic-service"
path = "../../unittest/diagnostic_service.rs"

[[test]]
name = "diagnostic-privacy"
path = "../../unittest/diagnostic_privacy.rs"

[[test]]
name = "diagnostic-control"
path = "../diagnostic_control.rs"

[[test]]
name = "model-storage"
path = "../model_storage.rs"

[[test]]
name = "native-delivery"
path = "../native_delivery.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[[test]]
name = "window-lifecycle"
path = "../../unittest/desktop_window_lifecycle.rs"

[[test]]
name = "overlay-lifecycle"
path = "../../unittest/desktop_overlay_lifecycle.rs"

[[test]]
name = "capture-startup"
path = "../../unittest/capture_startup.rs"

[[test]]
name = "capture-readiness"
path = "../capture_readiness.rs"

[[test]]
name = "diagnostic-api"
path = "../../unittest/diagnostic_api.rs"

[[test]]
name = "provider-config"
path = "../../unittest/provider_config.rs"

[[test]]
name = "provider-config-store"
path = "../provider_config.rs"

[[test]]
name = "provider-models"
path = "../provider_models.rs"
