<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notype — 圖示設計提案</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap');
:root{color-scheme:light;--paper:#f7f5ef;--ink:#292b26;--muted:#74766c;--line:#dfdfd4;--green:#647662;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif}button{font:inherit}main{max-width:1430px;margin:auto;padding:0 64px 80px}.bar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:700;letter-spacing:-1.2px}.brand span{color:#9caa94}.bar-right,.eyebrow,.tag,.number,.smallcaps{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--muted)}.bar-right{letter-spacing:1.2px}.intro{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;padding:80px 0 58px}.eyebrow{color:#788a73;margin:0 0 18px}h1{font-family:'Noto Serif TC',serif;font-size:clamp(34px,4vw,55px);line-height:1.28;letter-spacing:2px;margin:0;font-weight:600}h1 em{font-style:normal;color:#788a73}.lead{max-width:455px;color:#777970;line-height:2;font-size:14px;margin:0 0 3px}.section-head{border-top:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:18px 0 25px}.section-head h2{font-size:12px;letter-spacing:1.6px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid #e7e7df;border-radius:7px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-align:left;padding:0;color:inherit;min-width:0}.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px #43463312;border-color:#aab8a1}.card[aria-pressed=true]{border-color:#667b60;box-shadow:0 0 0 2px #667b60}.art{height:204px;display:grid;place-items:center;position:relative}.art svg{width:122px;height:122px;filter:drop-shadow(0 8px 8px #292b2612)}.number{position:absolute;top:16px;left:18px;color:#85887d}.info{padding:18px 18px 20px;min-height:160px}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700}.tag{letter-spacing:.8px;font-size:9px;color:#98a08e}.concept{font-size:12px;line-height:1.8;color:#75776d;margin:12px 0 0}.selection{margin-top:50px;background:#e9ede4;border:1px solid #dbe2d6;border-radius:8px;padding:28px 32px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:25px}.selection h2{font-family:'Noto Serif TC',serif;font-size:20px;margin:8px 0}.selection p{color:#677267;line-height:1.8;font-size:13px;margin:0}.chosen{display:flex;gap:18px;align-items:center}.chosen svg{width:64px;height:64px}.chosen strong{display:block;font-size:15px}.chosen small{display:block;color:#778174;font-size:11px;margin-top:7px}.footer{display:flex;justify-content:space-between;margin-top:40px;color:#93958b;font-size:11px;line-height:1.8}.focus:focus-visible,.card:focus-visible{outline:3px solid #8d9f83;outline-offset:4px}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:0 32px 60px}}@media(max-width:650px){main{padding:0 20px 50px}.bar{height:70px}.bar-right{font-size:9px}.intro{grid-template-columns:1fr;gap:18px;padding:50px 0 40px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.art{height:158px}.art svg{width:98px;height:98px}.info{padding:15px;min-height:160px}.tag{display:none}.section-head p{font-size:10px}.selection{grid-template-columns:1fr;padding:23px}.footer{display:block}}
</style>
</head>
<body>
<main>
  <header class="bar"><div class="brand">no<span>type</span><span style="color:#bdc8b5">.</span></div><div class="bar-right">ICON EXPLORATIONS &nbsp; / &nbsp; 2026</div></header>
  <section class="intro"><div><p class="eyebrow">VOICE, MADE VISIBLE &nbsp; / &nbsp; 01 — 10</p><h1>讓聲音，<br><em>有一個形狀。</em></h1></div><p class="lead">十個為 notype 繪製的原創圖示提案。從日常、自然與留白取材，將說話與文字之間的轉換，化作安靜而清晰的符號。點選一款，看看你的選擇。</p></section>
  <div class="section-head"><h2>十種提案 <span style="font-weight:400;color:#a2a498"> / 10 CONCEPTS</span></h2><p>點擊卡片選擇你的喜好</p></div>
  <section class="grid" id="grid" aria-label="圖示提案"></section>
  <section class="selection" aria-live="polite"><div><div class="smallcaps">YOUR SELECTION</div><h2 id="selected-title">選一個你喜歡的方向</h2><p id="selected-description">點選上方任一設計，這裡會顯示方案名稱與編號。你可以隨時更換。</p></div><div class="chosen" id="chosen"></div></section>
  <footer class="footer"><span>NOTYPE &nbsp; / &nbsp; ICON DESIGN STUDY</span><span>概念提案 · 顏色與細節皆可再調整</span></footer>
</main>
<script>
const designs=[
 {name:'聲の芽',en:'KOTO NO ME',tag:'GROWTH',bg:'#e9eee3',color:'#61795c',concept:'從一顆種子長出兩片聲波葉，象徵想法經過口述，慢慢長成文字。',shape:`<path d="M50 70V46"/><path d="M50 56C35 56 29 48 29 37c12 0 21 6 21 19Z"/><path d="M50 48c0-12 8-19 21-19 0 12-6 19-21 19Z"/><path d="M38 73h24"/>`},
 {name:'餘音',en:'YOIN',tag:'RESONANCE',bg:'#f2e9dc',color:'#9b6b4f',concept:'一個不封口的圓，收住聲音又保留呼吸的空間，像日本庭園中的靜謐留白。',shape:`<path d="M69 27a29 29 0 1 0 7 36"/><path d="M39 46v8M50 38v24M61 44v12"/>`},
 {name:'言の折',en:'KOTO NO ORI',tag:'ORIGAMI',bg:'#e8edf0',color:'#607c87',concept:'將紙鶴的折線化成抽象字母 N，象徵把轉瞬即逝的聲音，摺成可以保存的文字。',shape:`<path d="M28 69V31l22 24 22-24v38"/><path d="M28 31l22 12 22-12M50 43v12"/>`},
 {name:'小鈴',en:'KOSUZU',tag:'CLARITY',bg:'#f3e8e1',color:'#a46e62',concept:'以小鈴與細線構成語音符號，傳達輕巧、清澈且隨時可用的輸入體驗。',shape:`<path d="M34 57c4-5 5-10 5-16a11 11 0 0 1 22 0c0 6 1 11 5 16H34Z"/><path d="M46 63a4 4 0 0 0 8 0M50 26v4M26 39l-4-3M74 39l4-3"/>`},
 {name:'波紋',en:'HAMON',tag:'RIPPLE',bg:'#e7eeeb',color:'#66877b',concept:'聲音落入水面形成層層波紋，中間的方形留白代表最後留下的文字。',shape:`<rect x="44" y="44" width="12" height="12" rx="2"/><path d="M35 35a21 21 0 0 0 0 30M65 35a21 21 0 0 1 0 30M27 27a32 32 0 0 0 0 46M73 27a32 32 0 0 1 0 46"/>`},
 {name:'結び',en:'MUSUBI',tag:'CONNECTION',bg:'#f1e8e5',color:'#a46f70',concept:'以水引結的雙環表示聲音與文字相連；一筆相接，也呼應自然流暢的輸入。',shape:`<path d="M50 50C31 26 23 38 28 48c5 11 22 2 22 2s17-9 22 2c5 10-3 22-22-2Z"/><path d="M50 50c-8 11-11 17-15 23M50 50c8 11 11 17 15 23"/>`},
 {name:'余白',en:'YOHAKU',tag:'SIMPLICITY',bg:'#eeede6',color:'#74786b',concept:'將對話框留下一個開口，再以短線暗示語音；用留白表達不打擾思考的工具。',shape:`<path d="M70 57V33a6 6 0 0 0-6-6H36a6 6 0 0 0-6 6v26a6 6 0 0 0 6 6h8l6 8 6-8h8"/><path d="M41 42v8M50 37v18M59 42v8"/>`},
 {name:'森の声',en:'MORI NO KOE',tag:'NATURE',bg:'#e5ebe4',color:'#526f62',concept:'一片葉子中藏著聲波與筆尖，讓語音輸入像自然生長一樣，簡單而有溫度。',shape:`<path d="M26 68C25 42 42 27 72 28c1 29-14 45-39 45"/><path d="M29 70l34-32M39 59l-1-11M48 50l-1-10M49 59l10 1"/>`},
 {name:'ひとふで',en:'HITOFUDE',tag:'ONE STROKE',bg:'#f1ece0',color:'#a18455',concept:'以一筆流線穿過三個節點，象徵開始說話、辨識與文字落下的連續過程。',shape:`<path d="M23 60c9-28 18-28 27-8 8 20 17 20 27-12"/><circle cx="24" cy="58" r="3" fill="currentColor" stroke="none"/><circle cx="50" cy="52" r="3" fill="currentColor" stroke="none"/><circle cx="76" cy="42" r="3" fill="currentColor" stroke="none"/>`},
 {name:'音の窓',en:'OTO NO MADO',tag:'WINDOW',bg:'#e9e9ef',color:'#73758f',concept:'靈感來自日式格窗，窗內一條聲波化為文字線條，呈現安定、有秩序的節奏。',shape:`<rect x="26" y="26" width="48" height="48" rx="6"/><path d="M26 49h48M49 26v48M33 40l4-5 4 9 4-5M56 59h11M56 65h8"/>`}
];
function icon(d){return `<svg viewBox="0 0 100 100" role="img" aria-label="${d.name}圖示" style="color:${d.color}"><rect x="3" y="3" width="94" height="94" rx="24" fill="${d.color}"/><g fill="none" stroke="#fffdf8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="color:#fffdf8">${d.shape}</g></svg>`}
const grid=document.querySelector('#grid'),chosen=document.querySelector('#chosen');
designs.forEach((d,i)=>{const button=document.createElement('button');button.className='card';button.type='button';button.setAttribute('aria-pressed','false');button.innerHTML=`<div class="art" style="background:${d.bg}"><span class="number">${String(i+1).padStart(2,'0')}</span>${icon(d)}</div><div class="info"><div class="meta"><span class="name">${d.name}</span><span class="tag">${d.tag}</span></div><p class="concept">${d.concept}</p></div>`;button.addEventListener('click',()=>select(i));grid.append(button)});
function select(i){const d=designs[i];document.querySelectorAll('.card').forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));document.querySelector('#selected-title').textContent=`你選擇了 ${String(i+1).padStart(2,'0')} / ${d.name}`;document.querySelector('#selected-description').textContent=d.concept;chosen.innerHTML=`${icon(d)}<div><strong>${d.name}</strong><small>${d.en} · NO. ${String(i+1).padStart(2,'0')}</small></div>`;try{localStorage.setItem('notype-icon-choice',String(i))}catch{}}
try{const saved=localStorage.getItem('notype-icon-choice');if(saved!==null&&/^\d+$/.test(saved)&&Number(saved)<designs.length)select(Number(saved))}catch{}
</script>
</body>
</html>
