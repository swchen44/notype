name: Shared core contracts

on:
  push:
    branches: [main, implement/notype-mvp]
    paths:
      - .github/workflows/core-contracts.yml
      - crates/notype-core/**
      - crates/notype-platform/**
      - tests/unittest/**
      - tests/integration/core_*.rs
      - tests/integration/desktop-contracts/**
      - tests/integration/history_metrics_dto.rs
      - desktop/src-tauri/src/commands/history_metrics.rs
      - tests/integration/desktop_provider.rs
      - tests/integration/desktop_diagnostics.rs
      - tests/integration/capture_readiness.rs
      - tests/integration/deepseek_probe_*.rs
      - scripts/Start-deepseek-probe.cmd
      - tests/integration/diagnostic_control.rs
      - tests/integration/model_storage.rs
      - tests/integration/native_delivery.rs
      - tests/integration/text-flow.test.mjs
      - tests/integration/portable-*.test.mjs
      - tests/integration/fixtures/portable-package.mjs
      - tests/integration/fixtures/activate-model-worker.mjs
      - tests/integration/portable_native.rs
      - desktop/src-tauri/src/workflow.rs
      - desktop/src-tauri/src/diagnostics.rs
      - desktop/src-tauri/src/diagnostic_*.rs
      - desktop/src-tauri/src/managers/model_storage.rs
      - desktop/src-tauri/src/managers/model.rs
      - desktop/src/lib/diagnosticIssue.ts
      - desktop/src-tauri/src/faithful_provider.rs
      - desktop/src-tauri/src/recognition.rs
      - desktop/src-tauri/src/physical_gestures.rs
      - desktop/src-tauri/src/native_input.rs
      - desktop/src-tauri/src/window_lifecycle.rs
      - desktop/src-tauri/src/overlay_lifecycle.rs
      - desktop/src-tauri/src/capture_startup.rs
      - desktop/src-tauri/src/capture_observations.rs
      - desktop/src-tauri/src/deepseek_probe/**
      - src/**
      - package.json
      - package-lock.json
      - packages/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-ui:
    name: Provider settings rendered contracts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22
      - run: npm ci --ignore-scripts
      - name: Install existing locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Select and verify an actual browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            browser="$(command -v google-chrome)"
            "$browser" --version
            echo "NOTYPE_TEST_BROWSER=$browser" >> "$GITHUB_ENV"
          else
            node desktop/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Exercise provider connection rendered contracts when present
        run: |
          if test -f tests/integration/provider-connections.ui.mjs; then
            node --test tests/integration/provider-connections.ui.mjs
          else
            echo "Provider UI implementation is not composed in this backend checkpoint."
          fi
  portable-core:
    name: Core, desktop workflow and diagnostic contracts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the verified Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check core formatting
        run: cargo +1.99.1 fmt --manifest-path crates/notype-core/Cargo.toml -- --check
      - name: Check platform adapter formatting
        run: cargo +1.99.1 fmt --manifest-path crates/notype-platform/Cargo.toml -- --check
      - name: Exercise the native launch policy without Tauri or speech engines
        run: cargo +1.99.1 test --locked --manifest-path crates/notype-platform/Cargo.toml --test portable-native
      - name: Lint the platform adapter
        run: cargo +1.99.1 clippy --locked --manifest-path crates/notype-platform/Cargo.toml --all-targets -- -D warnings
      - name: Exercise the public core contracts without Windows or Tauri
        run: cargo +1.99.1 test --locked --manifest-path crates/notype-core/Cargo.toml
      - name: Lint the core
        run: cargo +1.99.1 clippy --locked --manifest-path crates/notype-core/Cargo.toml --all-targets -- -D warnings
      - name: Exercise desktop orchestration and HTTP contracts without Tauri
        run: cargo +1.99.1 test --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test desktop-workflow --test desktop-provider --test history-metrics-dto --test physical-gestures --test native-delivery --test desktop-diagnostics --test diagnostics-export --test diagnostic-service --test diagnostic-api --test diagnostic-privacy --test diagnostic-control --test model-storage --test window-lifecycle --test overlay-lifecycle --test capture-startup --test capture-readiness --test deepseek-probe-bridge --test deepseek-probe-round --test deepseek-probe-console --test deepseek-probe-native
      - name: Lint the actual desktop HTTP adapter without Tauri
        run: cargo +1.99.1 clippy --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test desktop-provider -- -D warnings
      - name: Exercise independent offline probe policy without HTTP or credentials
        run: |
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_policy.rs -o /tmp/notype-probe-policy
          /tmp/notype-probe-policy
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_round.rs -o /tmp/notype-probe-round
          /tmp/notype-probe-round
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_console.rs -o /tmp/notype-probe-console
          /tmp/notype-probe-console
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run test:integration
