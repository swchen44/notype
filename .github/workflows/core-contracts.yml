  push:
    branches: [main, implement/notype-mvp]
    paths:
      - .github/workflows/core-contracts.yml
      - crates/notype-core/**
      - crates/notype-platform/**
      - tests/unittest/**
      - tests/integration/core_*.rs
      - tests/integration/desktop-contracts/**
      - tests/integration/history_metrics_dto.rs
      - desktop/src-tauri/src/commands/history_metrics.rs
      - tests/integration/provider_config.rs
      - tests/integration/provider_models.rs
      - tests/integration/provider_bootstrap.rs
      - tests/integration/bootstrap-recovery.ui.mjs
      - tests/integration/offline-bundle.test.mjs
      - tests/integration/fixtures/offline-bundle.mjs
      - tests/integration/diagnostic_api.rs
      - tests/integration/desktop_provider.rs
      - tests/integration/desktop_diagnostics.rs
      - tests/integration/capture_readiness.rs
      - tests/integration/deepseek_probe_*.rs
      - scripts/Start-deepseek-probe.cmd
      - tests/integration/diagnostic_control.rs
      - tests/integration/model_storage.rs
      - tests/integration/model_roots.rs
      - tests/integration/model-roots*.mjs
      - tests/integration/native_delivery.rs
      - tests/integration/text-flow.test.mjs
      - tests/integration/portable-*.test.mjs
      - tests/integration/fixtures/portable-package.mjs
      - tests/integration/fixtures/activate-model-worker.mjs
      - tests/integration/portable_native.rs
      - desktop/src-tauri/src/workflow.rs
      - desktop/src-tauri/src/diagnostics.rs
      - desktop/src-tauri/src/diagnostic_*.rs
      - desktop/src-tauri/src/managers/model_storage.rs
      - desktop/src-tauri/src/managers/model.rs
      - desktop/src-tauri/src/managers/model/**
      - desktop/src-tauri/src/managers/model_root*.rs
      - desktop/src-tauri/src/managers/model_engine_state.rs
      - desktop/src-tauri/src/managers/model_transfer_worker.rs
      - desktop/src-tauri/src/managers/model_runtime_metadata.rs
      - desktop/src-tauri/src/managers/transcription.rs
      - desktop/src-tauri/src/managers/audio.rs
      - desktop/src-tauri/src/actions.rs
      - desktop/src-tauri/src/commands/models.rs
      - desktop/src-tauri/src/lib.rs
      - desktop/src-tauri/src/physical_shortcuts.rs
      - desktop/src-tauri/src/transcription_coordinator.rs
      - desktop/src/lib/diagnosticIssue.ts
      - desktop/src-tauri/src/provider_*.rs
      - desktop/src-tauri/src/provider_probe/**
      - tests/integration/provider_probe_*.rs
      - desktop/src-tauri/src/offline_bootstrap*.rs
      - desktop/src-tauri/src/portable.rs
      - desktop/src-tauri/src/runtime_startup.rs
      - tests/integration/bootstrap_preflight.rs
      - tests/integration/history-metrics.ui.mjs
      - tests/integration/fixtures/history-api.mjs
      - desktop/src-tauri/src/settings.rs
      - desktop/src-tauri/src/lib.rs
      - desktop/src-tauri/src/faithful_provider.rs
      - desktop/src-tauri/src/recognition.rs
      - desktop/src-tauri/src/physical_gestures.rs
      - desktop/src-tauri/src/native_clipboard.rs
      - desktop/src-tauri/src/native_clipboard_state.rs
      - desktop/src-tauri/src/native_target_policy.rs
      - desktop/src-tauri/src/connection_activity.rs
      - desktop/src-tauri/src/shortcut/dictionary.rs
      - tests/integration/connection_activity.rs
      - tests/integration/usability.ui.mjs
      - desktop/src-tauri/src/native_input.rs
      - desktop/src-tauri/src/window_lifecycle.rs
      - desktop/src-tauri/src/overlay_lifecycle.rs
      - desktop/src-tauri/src/capture_startup.rs
      - desktop/src-tauri/src/capture_observations.rs
      - desktop/src-tauri/src/deepseek_probe/**
      - src/**
      - package.json
      - package-lock.json
      - packages/**
  workflow_dispatch:
    inputs:
      scope:
        description: Development check scope; final acceptance requires all
        type: choice
        options: [all, frontend]
        default: all

permissions:
  contents: read

jobs:
  provider-ui:
    name: Provider settings rendered contracts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22
      - run: npm ci --ignore-scripts
      - name: Install existing locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Select and verify an actual browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            browser="$(command -v google-chrome)"
            "$browser" --version
            echo "NOTYPE_TEST_BROWSER=$browser" >> "$GITHUB_ENV"
          else
            node desktop/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Exercise all composed UI units and rendered contracts
        run: |
          npm run test:ui:unit
          npm run test:ui:integration
      - name: Lint and build composed provider UI
        working-directory: desktop
        run: |
          if test -f ../tests/integration/provider-connections.ui.mjs; then
            bun run lint
            bun run build
          fi
  portable-core:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'frontend'
    name: Core, desktop workflow and diagnostic contracts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the verified Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check core formatting
        run: cargo +1.99.1 fmt --manifest-path crates/notype-core/Cargo.toml -- --check
      - name: Exercise first-use bootstrap without native dependencies
        run: cargo +1.99.1 test --locked --no-fail-fast --manifest-path tests/integration/desktop-contracts/Cargo.toml --test provider-bootstrap --test offline-bootstrap-store --test runtime-startup --test bootstrap-preflight
      - name: Lint bootstrap placement and runtime ownership without native dependencies
        run: cargo +1.99.1 clippy --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test provider-bootstrap --test offline-bootstrap-store --test runtime-startup --test bootstrap-preflight -- -D warnings
      - name: Exercise bounded YAML syntax without App or credential access
        run: |
          cargo +1.99.1 test --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test settings-yaml
          cargo +1.99.1 clippy --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test settings-yaml -- -D warnings
      - name: Check platform adapter formatting
        run: cargo +1.99.1 fmt --manifest-path crates/notype-platform/Cargo.toml -- --check
      - name: Exercise the native launch policy without Tauri or speech engines
        run: cargo +1.99.1 test --locked --manifest-path crates/notype-platform/Cargo.toml --test portable-native
      - name: Lint the platform adapter
        run: cargo +1.99.1 clippy --locked --manifest-path crates/notype-platform/Cargo.toml --all-targets -- -D warnings
      - name: Exercise the public core contracts without Windows or Tauri
        run: cargo +1.99.1 test --locked --manifest-path crates/notype-core/Cargo.toml
      - name: Lint the core
        run: cargo +1.99.1 clippy --locked --manifest-path crates/notype-core/Cargo.toml --all-targets -- -D warnings
      - name: Exercise desktop orchestration and HTTP contracts without Tauri
        run: cargo +1.99.1 test --locked --no-fail-fast --manifest-path tests/integration/desktop-contracts/Cargo.toml --test desktop-workflow --test desktop-provider --test history-metrics-dto --test physical-gestures --test native-delivery --test desktop-diagnostics --test diagnostics-export --test diagnostic-service --test diagnostic-api --test diagnostic-api-http --test provider-config --test provider-config-store --test provider-models --test diagnostic-privacy --test diagnostic-control --test model-storage --test model-roots-policy --test model-roots --test model-transfer-worker --test dictionary-words --test native-target-policy --test native-clipboard-state --test connection-activity --test provider-probe-policy --test provider-probe-runtime --test window-lifecycle --test overlay-lifecycle --test capture-startup --test capture-readiness --test deepseek-probe-bridge --test deepseek-probe-round --test deepseek-probe-console --test deepseek-probe-native
      - name: Lint the actual desktop HTTP adapter without Tauri
        run: cargo +1.99.1 clippy --locked --manifest-path tests/integration/desktop-contracts/Cargo.toml --test desktop-provider --test provider-config --test provider-config-store --test provider-models --test diagnostic-api-http --test model-roots-policy --test model-roots --test model-transfer-worker --test dictionary-words --test native-target-policy --test native-clipboard-state --test connection-activity --test provider-probe-policy --test provider-probe-runtime -- -D warnings
      - name: Exercise independent offline probe policy without HTTP or credentials
        run: |
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_policy.rs -o /tmp/notype-probe-policy
          /tmp/notype-probe-policy
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_round.rs -o /tmp/notype-probe-round
          /tmp/notype-probe-round
          rustc +1.99.1 --edition=2021 -A dead_code --test tests/unittest/deepseek_probe_console.rs -o /tmp/notype-probe-console
          /tmp/notype-probe-console
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run test:integration
