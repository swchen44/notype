name: Temporary Windows restricted fixture subsystem diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Console fixture control
        id: console
        continue-on-error: true
        env:
          NOTYPE_FIXTURE_SUBSYSTEM: console
        run: node --test tests/integration/restricted-smoke.test.mjs
      - name: Windows fixture experiment
        id: windows
        continue-on-error: true
        run: node --test tests/integration/restricted-smoke.test.mjs
      - name: Record control outcome
        env:
          CONSOLE_OUTCOME: ${{ steps.console.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
        run: |
          Write-Output ("console-control=" + $env:CONSOLE_OUTCOME)
          Write-Output ("windows-experiment=" + $env:WINDOWS_OUTCOME)
          if ($env:WINDOWS_OUTCOME -ne 'success') { throw 'windows-fixture-failed' }
