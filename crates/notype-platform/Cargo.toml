[package]
name = "notype-platform"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "notype-platform-check"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "portable-native"
path = "../../tests/integration/portable_native.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
